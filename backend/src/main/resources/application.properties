spring.application.name=CodeCalibrateApi
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/code_calibrate}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
exercise-content.github.api-url=https://api.github.com
exercise-content.github.repository=garretgonzales/codecalibrate-exercise-content
exercise-content.github.revision=db6b7da0ce92f563d80143a7aa08f94ebd246a0b
exercise-content.github.exercise-directory=exercises/java
exercise-content.github.token=${GITHUB_EXERCISE_CONTENT_TOKEN}
judge0.api-url=${JUDGE0_API_URL}
judge0.rapid-api-host=${JUDGE0_RAPID_API_HOST}
judge0.rapid-api-key=${JUDGE0_RAPID_API_KEY}
judge0.java-language-id=${JUDGE0_JAVA_LANGUAGE_ID}

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
