<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="40"
  height="40"
  fill="none"
  aria-hidden="true"
  focusable="false"
  class="code-calibrate-icon"
>
  <defs>
    <linearGradient id="cc-bracket-front" x1="0" y1="36" x2="0" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: color-mix(in srgb, var(--theme-primary, #863bff) 72%, white)" />
      <stop offset="0.52" style="stop-color: var(--theme-primary, #863bff)" />
      <stop offset="1" style="stop-color: color-mix(in srgb, var(--theme-primary, #863bff) 86%, black)" />
    </linearGradient>
    <linearGradient id="cc-bracket-depth" x1="0" y1="40" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: color-mix(in srgb, var(--theme-primary, #863bff) 72%, black)" />
      <stop offset="1" style="stop-color: color-mix(in srgb, var(--theme-primary, #863bff) 54%, black)" />
    </linearGradient>
    <linearGradient id="cc-star-front" x1="0" y1="82" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: color-mix(in srgb, var(--theme-accent, #47bfff) 74%, white)" />
      <stop offset="1" style="stop-color: var(--theme-accent, #47bfff)" />
    </linearGradient>
    <linearGradient id="cc-star-depth" x1="0" y1="86" x2="0" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: color-mix(in srgb, var(--theme-accent, #47bfff) 78%, black)" />
      <stop offset="1" style="stop-color: color-mix(in srgb, var(--theme-accent, #47bfff) 58%, black)" />
    </linearGradient>
    <g id="cc-star-shape">
      <rect x="119" y="82" width="18" height="92" rx="2" />
      <rect x="119" y="82" width="18" height="92" rx="2" transform="rotate(60 128 128)" />
      <rect x="119" y="82" width="18" height="92" rx="2" transform="rotate(-60 128 128)" />
    </g>
    <style>
      .cc-left-motion,
      .cc-right-motion,
      .cc-star-motion {
        transform-box: view-box;
        transform-origin: 128px 128px;
        animation-duration: 2400ms;
        animation-iteration-count: 1;
        animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
      }

      .cc-left-motion,
      .cc-right-motion,
      .cc-star-motion {
        animation-name: none;
      }

      .code-calibrate-brand-link:hover .cc-left-motion,
      .code-calibrate-brand-link:active .cc-left-motion,
      .code-calibrate-brand-link:focus-visible .cc-left-motion {
        animation-name: cc-calibrate-left;
      }

      .code-calibrate-brand-link:hover .cc-right-motion,
      .code-calibrate-brand-link:active .cc-right-motion,
      .code-calibrate-brand-link:focus-visible .cc-right-motion {
        animation-name: cc-calibrate-right;
      }

      .code-calibrate-brand-link:hover .cc-star-motion,
      .code-calibrate-brand-link:active .cc-star-motion,
      .code-calibrate-brand-link:focus-visible .cc-star-motion {
        animation-name: cc-calibrate-star;
      }

      @keyframes cc-calibrate-left {
        0%, 18%, 52%, 100% { transform: translateX(0); }
        35% { transform: translateX(-5px); }
      }

      @keyframes cc-calibrate-right {
        0%, 18%, 52%, 100% { transform: translateX(0); }
        35% { transform: translateX(5px); }
      }

      @keyframes cc-calibrate-star {
        0%, 18%, 52%, 100% { transform: scale(1); }
        35% { transform: scale(1.06); }
      }

      @media (prefers-reduced-motion: reduce) {
        .cc-left-motion,
        .cc-right-motion,
        .cc-star-motion {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g shape-rendering="geometricPrecision">
    <g class="cc-left-motion">
      <path
        d="M34 44H92V66H58V190H92V212H34V44Z"
        fill="url(#cc-bracket-depth)"
        transform="translate(6 6)"
      />
    </g>
    <g class="cc-right-motion">
      <path
        d="M222 44H164V66H198V190H164V212H222V44Z"
        fill="url(#cc-bracket-depth)"
        transform="translate(6 6)"
      />
    </g>

    <g class="cc-left-motion">
      <path d="M34 44H92V66H58V190H92V212H34V44Z" fill="url(#cc-bracket-front)" />
    </g>
    <g class="cc-right-motion">
      <path d="M222 44H164V66H198V190H164V212H222V44Z" fill="url(#cc-bracket-front)" />
    </g>

    <g class="cc-left-motion">
      <path
        d="M58 66H92L98 72H64V196L58 190V66Z"
        style="fill: color-mix(in srgb, var(--theme-primary, #863bff) 62%, black)"
        opacity="0.78"
      />
    </g>
    <g class="cc-right-motion">
      <path
        d="M198 66H164L170 72H192V196L198 190V66Z"
        style="fill: color-mix(in srgb, var(--theme-primary, #863bff) 62%, black)"
        opacity="0.78"
      />
    </g>
    <g class="cc-left-motion">
      <path
        d="M58 190H92L98 196H64V218L58 212V190Z"
        style="fill: color-mix(in srgb, var(--theme-primary, #863bff) 58%, black)"
        opacity="0.9"
      />
    </g>
    <g class="cc-right-motion">
      <path
        d="M198 190H164L170 196H192V218L198 212V190Z"
        style="fill: color-mix(in srgb, var(--theme-primary, #863bff) 58%, black)"
        opacity="0.9"
      />
    </g>

    <g class="cc-star-motion">
      <g fill="url(#cc-star-depth)" transform="translate(5 6)">
        <use href="#cc-star-shape" />
      </g>
    </g>
    <g class="cc-star-motion">
      <g fill="url(#cc-star-front)">
        <use href="#cc-star-shape" />
      </g>
    </g>
  </g>
</svg>
